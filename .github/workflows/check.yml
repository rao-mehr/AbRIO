name: Prüfen
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Daten validieren
        run: python tools/validate.py
      - name: index.html ist aus den Quellen gebaut
        run: python tools/build.py --check --no-validate
